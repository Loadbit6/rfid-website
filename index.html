<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RFID Tag Manager</title>

<style>
body {
  font-family: Roboto, sans-serif;
  background: #111;
  color: #eee;
  padding: 20px;
}

h1, h2 {
  margin-top: 0;
}

.card {
  background: #1b1b1b;
  padding: 15px;
  margin-bottom: 20px;
  border-radius: 12px;
}

input {
  padding: 6px;
  background: #111;
  color: #eee;
  border: 1px solid #333;
  border-radius: 6px;
}

button {
  padding: 6px 10px;
  background: #333;
  color: #eee;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  background: #444;
}

.danger {
  background: #b33;
}

.tag-card {
  background: #1e1e1e;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 10px;
}

.tag {
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}

.tag span {
  font-family: monospace;
}

.details {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid #333;
  display: none;
}
</style>
</head>

<body>

<h1>RFID Tag Manager</h1>

<div class="card">
  <h2>Last Scan</h2>
  <div id="lastScan">Waiting for scan</div>
  <br>
  <input id="newName" placeholder="Nickname">
  <button onclick="saveLast()">Save</button>
</div>

<div class="card">
  <h2>Saved Tags</h2>
  <div id="tagList">Loading…</div>
</div>

<script>
const ws = new WebSocket('ws://localhost:8080');
let lastUID = null;

ws.onopen = () => {
  ws.send(JSON.stringify({ type: 'getAllTags' }));
};

ws.onmessage = e => {
  const data = JSON.parse(e.data);

  if (data.type === 'scan') {
    lastUID = data.uid;
    document.getElementById('lastScan').textContent =
      data.uid + (data.nickname ? ' — ' + data.nickname : ' — (unsaved)');
    document.getElementById('newName').value = data.nickname || '';
  }

  if (data.type === 'allTags') {
    renderTags(data.tags);
  }
};

function saveLast() {
  if (!lastUID) return;

  ws.send(JSON.stringify({
    type: 'saveTag',
    uid: lastUID,
    nickname: document.getElementById('newName').value
  }));

  ws.send(JSON.stringify({ type: 'getAllTags' }));
}

function renderTags(tags) {
  const list = document.getElementById('tagList');
  list.innerHTML = '';

  if (Object.keys(tags).length === 0) {
    list.textContent = 'No saved tags';
    return;
  }

  Object.entries(tags).forEach(([uid, data]) => {
    const card = document.createElement('div');
    card.className = 'tag-card';

    card.innerHTML = `
      <div class="tag" onclick="toggle('${uid}')">
        <span>${data.nickname || 'Unnamed'} - ${uid}</span>
        <span>▼</span>
      </div>

      <div class="details" id="details-${uid}">
        <div>Nickname:</div>
        <input id="name-${uid}" value="${data.nickname || ''}" style="width:100%">
        <br><br>

        <div>Batch file:</div>
        <input value="${data.script || ''}" style="width:100%" readonly>
        <br><br>

        <input type="file" accept=".bat" onchange="uploadBat(event,'${uid}')">
        <br><br>

        <button onclick="saveTag('${uid}')">Save</button>
        <button class="danger" onclick="deleteTag('${uid}')">Delete</button>
