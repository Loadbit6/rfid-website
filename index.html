<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>RFID Tag Manager</title>
  <style>
    body {
      font-family: Roboto, sans-serif;
      padding: 20px;
      background: #111;
      color: #eee;
    }

    h1, h2 {
      margin-top: 0;
    }

    .card {
      background: #1e1e1e;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
    }

    input {
      padding: 5px;
      margin-right: 5px;
      background: #111;
      color: #eee;
      border-radius: 5px;
      border: 1px solid #333;
    }

    button {
      padding: 5px 10px;
      cursor: pointer;
    }

    .tag-card {
      background: #161616;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .tag-header {
      display: flex;
      justify-content: space-between;
      cursor: pointer;
    }

    .tag-details {
      display: none;
      margin-top: 8px;
    }

    .tag span {
      width: 160px;
      font-family: monospace;
    }

    .tag input {
      flex: 1;
      margin-right: 5px;
    }

    .danger {
      background: #b33;
      color: white;
    }

    .success {
      background-color: #6ab850;
      color: #19400c;
    }

    .small {
      font-size: 12px;
      opacity: 0.8;
    }
  </style>
</head>
<body>

<h1>RFID Tag Manager</h1>

<div class="card">
  <h2>Last Scan</h2>
  <div id="lastScan">Waiting for scan</div>
  <input id="lastName" placeholder="Nickname">
  <button class="success" onclick="saveLast()">Save</button>
</div>

<div class="card">
  <h2>Saved Tags</h2>
  <div id="tagList">Loading…</div>
</div>

<script>
const ws = new WebSocket("ws://localhost:8080");
let lastUID = null;
let tagsCache = {};

ws.onopen = () => {
  ws.send(JSON.stringify({ type: "getAllTags" }));
};

ws.onmessage = e => {
  const data = JSON.parse(e.data);

  if (data.type === "scan") {
    lastUID = data.uid;
    document.getElementById("lastScan").textContent =
      data.uid + (data.nickname ? " — " + data.nickname : " — (unsaved)");
    document.getElementById("lastName").value = data.nickname || "";
  }

  if (data.type === "allTags") {
    tagsCache = data.tags;
    renderTags();
  }
};

// ---------------- UI Functions ----------------

function saveLast() {
  if (!lastUID) return;

  ws.send(JSON.stringify({
    type: "saveTag",
    uid: lastUID,
    nickname: document.getElementById("lastName").value
  }));
}

function toggle(uid) {
  const el = document.getElementById("details-" + uid);
  el.style.display = el.style.display === "none" ? "block" : "none";
}

function saveName(uid) {
  const name = document.getElementById("name-" + uid).value;
  ws.send(JSON.stringify({
    type: "saveTag",
    uid,
    nickname: name
  }));
}

function deleteTag(uid) {
  ws.send(JSON.stringify({
    type: "deleteTag",
    uid
  }));
}

function uploadBatch(input, uid) {
  const file = input.files[0];
  if (!file) return;

  if (!file.name.toLowerCase().endsWith(".bat")) {
    alert("Only .bat files allowed");
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    const base64 = reader.result.split(",")[1];
    ws.send(JSON.stringify({
      type: "uploadBatch",
      uid,
      content: base64
    }));
  };
  reader.readAsDataURL(file);
}

// ---------------- Render ----------------

function renderTags() {
  const list = document.getElementById("tagList");
  list.innerHTML = "";

  const entries = Object.entries(tagsCache);
  if (entries.length === 0) {
    list.textContent = "No saved tags";
    return;
  }

  entries.forEach(([uid, data]) => {
    const card = document.createElement("div");
    card.className = "tag-card";

    card.innerHTML = `
      <div class="tag-header" onclick="toggle('${uid}')">
        <strong>${data.nickname || "(unnamed)"} – ${uid}</strong>
        <span>▼</span>
      </div>

      <div class="tag-details" id="details-${uid}">
        <div class="small">UID: ${uid}</div><br>

        <input id="name-${uid}" value="${data.nickname || ""}">
        <button onclick="saveName('${uid}')">Save Name</button>
        <br><br>

        <input type="file" accept=".bat" onchange="uploadBatch(this, '${uid}')">
        <div class="small">
          ${data.script ? "Batch file saved" : "No batch file"}
        </div>
        <br>

        <button class="danger" onclick="deleteTag('${uid}')">Delete Tag</button>
      </div>
    `;

    list.appendChild(card);
  });
}
</script>

</body>
</html>
