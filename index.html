<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RFID Tag Manager</title>

<style>
  body {
    font-family: Roboto, Arial, sans-serif;
    background: #111;
    color: #eee;
    padding: 20px;
  }

  h1, h2 {
    margin-top: 0;
  }

  .card {
    background: #1e1e1e;
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 12px;
    box-shadow: 0 0 10px #000;
  }

  .tag-card {
    background: #181818;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 12px;
    border: 1px solid #2a2a2a;
  }

  .tag-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }

  .tag-header span {
    font-family: monospace;
    font-size: 14px;
  }

  .details {
    display: none;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid #333;
  }

  input {
    width: 100%;
    padding: 6px;
    margin-top: 4px;
    background: #111;
    color: #eee;
    border: 1px solid #333;
    border-radius: 6px;
  }

  button {
    padding: 6px 12px;
    margin-top: 8px;
    cursor: pointer;
    background: #333;
    color: #eee;
    border: none;
    border-radius: 6px;
  }

  button:hover {
    background: #444;
  }

  .danger {
    background: #b33;
  }

  .danger:hover {
    background: #d44;
  }

  .save {
    background: #6ab850;
    color: #19400c;
  }

  .save:hover {
    background: #7ed15f;
  }

  .small {
    font-size: 12px;
    color: #aaa;
    margin-top: 6px;
  }
</style>
</head>

<body>

<h1>RFID Tag Manager</h1>

<div class="card">
  <h2>Last Scan</h2>
  <div id="lastScan">Waiting for scan…</div>

  <input id="newName" placeholder="Nickname">
  <button class="save" onclick="saveLast()">Save</button>
</div>

<div class="card">
  <h2>Saved Tags</h2>
  <div id="tagList">Loading…</div>
</div>

<script>
const ws = new WebSocket('ws://localhost:8080');

let lastUID = null;

ws.onopen = () => {
  ws.send(JSON.stringify({ type: 'getAllTags' }));
};

ws.onmessage = e => {
  const data = JSON.parse(e.data);

  if (data.type === 'scan') {
    lastUID = data.uid;
    document.getElementById('lastScan').textContent =
      data.nickname
        ? `${data.nickname} - ${data.uid}`
        : `${data.uid} (unsaved)`;

    document.getElementById('newName').value = data.nickname || '';
  }

  if (data.type === 'allTags') {
    renderTags(data.tags);
  }
};

function toggle(uid) {
  const d = document.getElementById('details-' + uid);
  const hidden = window.getComputedStyle(d).display === 'none';
  d.style.display = hidden ? 'block' : 'none';
}

function saveLast() {
  if (!lastUID) return;

  ws.send(JSON.stringify({
    type: 'saveTag',
    uid: lastUID,
    nickname: document.getElementById('newName').value
  }));

  ws.send(JSON.stringify({ type: 'getAllTags' }));
}

function saveTag(uid) {
  const name = document.getElementById('name-' + uid).value;

  ws.send(JSON.stringify({
    type: 'saveTag',
    uid,
    nickname: name
  }));
}

function deleteTag(uid) {
  ws.send(JSON.stringify({
    type: 'deleteTag',
    uid
  }));

  document.getElementById('card-' + uid).remove();
}

function uploadBat(e, uid) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    ws.send(JSON.stringify({
      type: 'uploadScript',
      uid,
      filename: file.name,
      content: reader.result
    }));
  };
  reader.readAsText(file);
}

function renderTags(tags) {
  const list = document.getElementById('tagList');
  list.innerHTML = '';

  const entries = Object.entries(tags);
  if (entries.length === 0) {
    list.textContent = 'No saved tags';
    return;
  }

  entries.forEach(([uid, data]) => {
    const card = document.createElement('div');
    card.className = 'tag-card';
    card.id = 'card-' + uid;

    card.innerHTML = `
      <div class="tag-header" onclick="toggle('${uid}')">
        <span>${data.nickname || 'Unnamed'} - ${uid}</span>
        <span>▼</span>
      </div>

      <div class="details" id="details-${uid}">
        <div>Nickname</div>
        <input id="name-${uid}" value="${data.nickname || ''}">

        <div style="margin-top:10px">Batch file</div>
        <input value="${data.script || ''}" readonly>

        <input type="file" accept=".bat" onchange="uploadBat(event,'${uid}')">

        <br>
        <button class="save" onclick="saveTag('${uid}')">Save</button>
        <button class="danger" onclick="deleteTag('${uid}')">Delete</button>

        <div class="small">Created: ${data.created || 'unknown'}</div>
        <div class="small">Last seen: ${data.lastSeen || 'never'}</div>
      </div>
    `;

    list.appendChild(card);
  });
}
</script>

</body>
</html>
