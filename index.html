<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>RFID Tag Manager</title>
  <style>
    body {
      font-family: Roboto, sans-serif;
      padding: 20px;
      background: #111;
      color: #eee;
    }

    h1, h2 {
      margin-top: 0;
    }

    .card {
      background: #1e1e1e;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
    }

    input {
      padding: 5px;
      margin-right: 5px;
      background: #111;
      color: #eee;
    }

    button {
      padding: 5px 10px;
      cursor: pointer;
    }

    .tag {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
    }

    .tag span {
      width: 160px;
      font-family: monospace;
    }

    .tag input {
      flex: 1;
      margin-right: 5px;
    }

    .danger {
      background: #b33;
      color: white;
    }
  </style>
</head>
<body>

<h1>RFID Tag Manager</h1>

<div class="card">
  <h2>Last Scan</h2>
  <div id="lastScan">Waiting for scan</div>
  <input id="newName" placeholder="Name">
  <button style="background-color: blue; color: white;" onclick="saveLast()">Save</button>
</div>

<div class="card">
  <h2>Saved Tags</h2>
  <div id="tagList">Loading…</div>
</div>

<script>
  const ws = new WebSocket('ws://localhost:8080');
  let lastUID = null;

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'getAllTags' }));
  };

  ws.onmessage = e => {
    const data = JSON.parse(e.data);

    if (data.type === 'scan') {
      lastUID = data.uid;
      document.getElementById('lastScan').textContent =
        data.uid + (data.nickname ? ` — ${data.nickname}` : ' — (unsaved)');
      document.getElementById('newName').value = data.nickname || '';
    }

    if (data.type === 'allTags') {
      renderTags(data.tags);
    }
  };

  function saveLast() {
    if (!lastUID) return;

    ws.send(JSON.stringify({
      type: 'saveTag',
      uid: lastUID,
      nickname: document.getElementById('newName').value
    }));

    ws.send(JSON.stringify({ type: 'getAllTags' }));
  }

  function saveTag(uid) {
    const name = document.getElementById(`name-${uid}`).value;

    ws.send(JSON.stringify({
      type: 'saveTag',
      uid,
      nickname: name
    }));
  }

  function deleteTag(uid) {
    ws.send(JSON.stringify({
      type: 'deleteTag',
      uid
    }));

    document.getElementById(`row-${uid}`).remove();
  }

  function renderTags(tags) {
    const list = document.getElementById('tagList');
    list.innerHTML = '';

    Object.entries(tags).forEach(([uid, data]) => {
      const row = document.createElement('div');
      row.className = 'tag';
      row.id = `row-${uid}`;

      row.innerHTML = `
        <span>${uid}</span>
        <input id="name-${uid}" value="${data.nickname}">
        <button onclick="saveTag('${uid}')">Save</button>
        <button class="danger" onclick="deleteTag('${uid}')">Delete</button>
      `;

      list.appendChild(row);
    });

    if (list.innerHTML === '') {
      list.textContent = 'No saved tags';
    }
  }
</script>

</body>
</html>
