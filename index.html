<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RFID Tag Manager</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

<style>
body {
  font-family: Roboto, sans-serif;
  background: #111;
  color: #eee;
  padding: 20px;
}

h1, h2 {
  margin-top: 0;
}

.card {
  background: #1e1e1e;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}

.tag-card {
  background: #181818;
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 10px;
  box-shadow: 0 0 0 1px #2a2a2a;
}

.tag {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.tag span {
  font-family: monospace;
  font-size: 13px;
}

input {
  background: #111;
  color: #eee;
  border: 1px solid #333;
  border-radius: 5px;
  padding: 5px;
}

button {
  margin-left: 5px;
  cursor: pointer;
}

.details {
  margin-top: 12px;
  display: none;
}

.danger {
  background: #b33;
  color: white;
}
</style>
</head>

<body>

<h1>RFID Tag Manager</h1>

<div class="card">
  <h2>Last Scan</h2>
  <div id="lastScan">Waiting for scan…</div>
  <input id="newName" placeholder="Nickname">
  <button onclick="saveLast()">Save</button>
</div>

<div class="card">
  <h2>Saved Tags</h2>
  <div id="tagList">Loading…</div>
</div>

<script>
const ws = new WebSocket('ws://localhost:8080');
let lastUID = null;

ws.onopen = () => {
  ws.send(JSON.stringify({ type: 'getAllTags' }));
};

ws.onerror = () => {
  document.getElementById('lastScan').textContent =
    'Desktop app not connected';
};

ws.onmessage = e => {
  const data = JSON.parse(e.data);

  if (data.type === 'scan') {
    lastUID = data.uid;
    document.getElementById('lastScan').textContent =
      data.uid + (data.nickname ? ' — ' + data.nickname : ' — (unsaved)');
    document.getElementById('newName').value = data.nickname || '';
  }

  if (data.type === 'allTags') {
    renderTags(data.tags);
  }
};

function saveLast() {
  if (!lastUID) return;

  ws.send(JSON.stringify({
    type: 'saveTag',
    uid: lastUID,
    nickname: document.getElementById('newName').value
  }));

  ws.send(JSON.stringify({ type: 'getAllTags' }));
}

function toggle(uid) {
  const d = document.getElementById('details-' + uid);
  d.style.display = d.style.display === 'none' ? 'block' : 'none';
}

function saveTag(uid) {
  ws.send(JSON.stringify({
    type: 'saveTag',
    uid,
    nickname: document.getElementById('name-' + uid).value
  }));
}

function deleteTag(uid) {
  ws.send(JSON.stringify({ type: 'deleteTag', uid }));
  document.getElementById('card-' + uid).remove();
}

function uploadBat(event, uid) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    ws.send(JSON.stringify({
      type: 'uploadScript',
      uid,
      content: reader.result
    }));
  };
  reader.readAsText(file);
}

function renderTags(tags) {
  const list = document.getElementById('tagList');
  list.innerHTML = '';

  Object.entries(tags).forEach(([uid, data]) => {
    const card = document.createElement('div');
    card.className = 'tag-card';
    card.id = 'card-' + uid;

    const displayName = data.nickname || 'Unnamed Tag';

    card.innerHTML = `
      <div class="tag">
        <span>${displayName} - ${uid}</span>
        <button onclick="toggle('${uid}')">▼</button>
      </div>

      <div class="details" id="details-${uid}">
        <div>Nickname:</div>
        <input id="name-${uid}" style="width:100%" value="${data.nickname || ''}">
        <br><br>

        <div>Batch file:</div>
        <input style="width:100%" value="${data.script || ''}" readonly>
        <br><br>

        <input type="file" accept=".bat" onchange="uploadBat(event,'${uid}')">
        <br><br>

        <button onclick="saveTag('${uid}')">Save</button>
        <button class="danger" onclick="deleteTag('${uid}')">Delete</button>

        <div style="font-size:12px;color:#aaa;margin-top:8px">
          Created: ${data.created ? new Date(data.created).toLocaleString() : '—'}<br>
          Last Seen: ${data.lastSeen ? new Date(data.lastSeen).toLocaleString() : '—'}
        </div>
      </div>
    `;

    list.appendChild(card);
  });

  if (!list.innerHTML) {
    list.textContent = 'No saved tags';
  }
}
</script>

</body>
</html>
