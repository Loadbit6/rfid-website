<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>RFID Tag Manager</title>

  <style>
    body {
      font-family: Roboto, sans-serif;
      padding: 20px;
      background: #111;
      color: #eee;
    }

    h1, h2 {
      margin-top: 0;
    }

    .card {
      background: #1e1e1e;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 12px;
    }

    .tag-card {
      background: #181818;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: inset 0 0 0 1px #222;
    }

    .tag-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .tag-header span {
      font-family: monospace;
      font-size: 14px;
    }

    .tag-header button {
      background: none;
      border: none;
      color: #aaa;
      font-size: 16px;
      transition: transform 0.25s ease;
      cursor: pointer;
    }

    .tag-header button.open {
      transform: rotate(180deg);
    }

    .details {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.35s ease, opacity 0.25s ease;
      margin-top: 10px;
    }

    .details.open {
      max-height: 600px;
      opacity: 1;
    }

    input {
      width: 100%;
      padding: 6px;
      margin-top: 4px;
      background: #111;
      color: #eee;
      border-radius: 6px;
      border: 1px solid #333;
    }

    button {
      padding: 6px 12px;
      margin-top: 8px;
      margin-right: 6px;
      cursor: pointer;
      border-radius: 6px;
      border: none;
      background: #444;
      color: #eee;
    }

    .danger {
      background: #b33;
      color: #fff;
    }

    .label {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 8px;
    }

    .muted {
      opacity: 0.6;
      font-size: 12px;
      margin-top: 6px;
    }
  </style>
</head>

<body>

<h1>RFID Tag Manager</h1>

<div class="card">
  <h2>Last Scan</h2>
  <div id="lastScan">Waiting for scan…</div>
  <input id="newName" placeholder="Nickname">
  <button style="background:#6ab850;color:#19400c" onclick="saveLast()">Save</button>
</div>

<div class="card">
  <h2>Saved Tags</h2>
  <div id="tagList">Loading…</div>
</div>

<script>
  const ws = new WebSocket('ws://localhost:8080');
  let lastUID = null;

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'getAllTags' }));
  };

  ws.onmessage = e => {
    const data = JSON.parse(e.data);

    if (data.type === 'scan') {
      lastUID = data.uid;
      document.getElementById('lastScan').textContent =
        data.nickname ? `${data.nickname} - ${data.uid}` : `${data.uid} - (unsaved)`;
      document.getElementById('newName').value = data.nickname || '';
    }

    if (data.type === 'allTags') {
      renderTags(data.tags);
    }
  };

  function saveLast() {
    if (!lastUID) return;

    ws.send(JSON.stringify({
      type: 'saveTag',
      uid: lastUID,
      nickname: document.getElementById('newName').value
    }));

    ws.send(JSON.stringify({ type: 'getAllTags' }));
  }

  function toggle(uid) {
    const details = document.getElementById('details-' + uid);
    const arrow = document.getElementById('arrow-' + uid);

    const open = details.classList.toggle('open');
    arrow.classList.toggle('open', open);
  }

  function saveTag(uid) {
    ws.send(JSON.stringify({
      type: 'saveTag',
      uid,
      nickname: document.getElementById('name-' + uid).value
    }));
  }

  function deleteTag(uid) {
    ws.send(JSON.stringify({ type: 'deleteTag', uid }));
    document.getElementById('card-' + uid).remove();
  }

  function uploadBat(e, uid) {
    const file = e.target.files[0];
    if (!file) return;

    ws.send(JSON.stringify({
      type: 'uploadBat',
      uid,
      filename: file.name
    }));
  }

  function renderTags(tags) {
    const list = document.getElementById('tagList');
    list.innerHTML = '';

    const entries = Object.entries(tags);
    if (entries.length === 0) {
      list.textContent = 'No saved tags';
      return;
    }

    entries.forEach(([uid, data]) => {
      const card = document.createElement('div');
      card.className = 'tag-card';
      card.id = 'card-' + uid;

      card.innerHTML = `
        <div class="tag-header" onclick="toggle('${uid}')">
          <span>${data.nickname || 'Unnamed Tag'} - ${uid}</span>
          <button id="arrow-${uid}">▼</button>
        </div>

        <div class="details" id="details-${uid}">
          <div class="label">Nickname</div>
          <input id="name-${uid}" value="${data.nickname || ''}">

          <div class="label">Batch file</div>
          <input value="${data.script || ''}" readonly>

          <input type="file" accept=".bat" onchange="uploadBat(event,'${uid}')">

          <button onclick="saveTag('${uid}')">Save</button>
          <button class="danger" onclick="deleteTag('${uid}')">Delete</button>

          <div class="muted">Created: ${data.created || 'Unknown'}</div>
          <div class="muted">Last seen: ${data.lastSeen || 'Never'}</div>
        </div>
      `;

      list.appendChild(card);
    });
  }
</script>

</body>
</html>
